# The default SQLite file is the same one used by the former Express backend.
server.port=${PORT:4000}
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:server/data/veloura.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# One connection serializes SQLite writes; conditional stock updates prevent overselling.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
veloura.client-origin=${CLIENT_ORIGIN:http://localhost:5173}
veloura.admin-email=${ADMIN_EMAIL:}
veloura.admin-password=${ADMIN_PASSWORD:}
veloura.admin-secret=${ADMIN_SESSION_SECRET:}
veloura.production=${VELOURA_PRODUCTION:false}
