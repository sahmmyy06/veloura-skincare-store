name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B -ntp verify

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: veloura-store:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          CID=$(docker run -d veloura-store:ci)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$CID" curl -fsS http://127.0.0.1:4000/api/health | grep -q '"ok":true'; then
              echo "health check passed"; exit 0
            fi
            sleep 2
          done
          docker logs "$CID" | tail -40
          exit 1
      # Publishing only happens from main, so feature branches never push images.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag veloura-store:ci "$IMAGE:sha-${GITHUB_SHA::12}"
          docker tag veloura-store:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"

  kubernetes:
    name: Kubernetes manifests (kind)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: kubectl kustomize deploy/k8s/base > /dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build image for the cluster
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: veloura-store:ci
          cache-from: type=gha
      - uses: helm/kind-action@v1
        with:
          cluster_name: veloura
      - name: Deploy to the kind cluster
        run: |
          kind load docker-image veloura-store:ci --name veloura
          kubectl create namespace veloura
          kubectl -n veloura create secret generic store-admin \
            --from-literal=ADMIN_EMAIL=admin@veloura.store \
            --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 18)" \
            --from-literal=ADMIN_SESSION_SECRET="$(openssl rand -hex 32)"
          TMP=$(mktemp -d); cp -r deploy/k8s/base/. "$TMP/"
          sed -i 's|newName: .*|newName: veloura-store|; s|newTag: .*|newTag: ci|' "$TMP/kustomization.yaml"
          kubectl apply -k "$TMP"
          kubectl -n veloura rollout status deployment/store --timeout=240s
      - name: Check the app through the Service
        run: |
          kubectl -n veloura port-forward service/store 4000:4000 &
          sleep 5
          curl -fsS http://127.0.0.1:4000/api/health
          echo
          kubectl -n veloura get deployment,pod,svc,pvc
      - name: Show pod logs on failure
        if: failure()
        run: |
          kubectl -n veloura describe pod -l app=store | tail -40
          kubectl -n veloura logs -l app=store --tail=60
